name: Build Android APK (4S Clima)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-capacitor-gps

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        env:
          CI: false
        run: npm run build:tecnico

      - name: Prepare Android Project
        run: |
          chmod +x apps/tecnico/android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > apps/tecnico/android/local.properties

      - name: Sync Capacitor Android
        env:
          CI: false
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          npm --workspace=@4s-clima/tecnico run cap:sync 2>&1 | tee sync_log.txt
        continue-on-error: true

      - name: Report Sync Log
        if: always()
        run: |
          echo "### Sync Capacitor Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sync_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build APK with Gradle
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1
          EXIT_CODE=$?
          echo "=== GRADLE BUILD OUTPUT ==="
          cat gradle_build.log
          echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SNIPPET=$(grep -E "(FAILURE:|What went wrong:|Execution failed for task)" -A 10 gradle_build.log | head -n 15 | tr '\r\n' ' ')
            if [ -z "$ERR_SNIPPET" ]; then
              ERR_SNIPPET=$(tail -n 10 gradle_build.log | tr '\r\n' ' ')
            fi
            echo "::error title=Gradle Failed::$ERR_SNIPPET"
            exit $EXIT_CODE
          fi
        working-directory: apps/tecnico/android

      - name: Find and Prepare APK for Download
        run: |
          mkdir -p apk_output
          echo "Listing all generated APKs in build directory:"
          find apps/tecnico/android -name "*.apk" -type f
          APK_FILE=$(find apps/tecnico/android -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp -v "$APK_FILE" apk_output/4S-Clima-Tecnico.apk
          else
            echo "ERROR: No APK found after assembleDebug"
            exit 1
          fi
          ls -lh apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4S-Clima-Tecnico-Debug-APK
          path: apk_output/4S-Clima-Tecnico.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-apk-test
          name: "4S Clima Técnico (APK Android)"
          body: "Descarga directa de APK para celulares de técnicos de 4S Clima con rastreo GPS en segundo plano."
          files: apk_output/4S-Clima-Tecnico.apk

name: Build Android APK (4S Clima)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-capacitor-gps

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        env:
          CI: false
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eaixkworazrzxcttdlpd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaXhrd29yYXpyenhjdHRkbHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTc0MjIsImV4cCI6MjEwNjQ3MzQyMn0.cuUQGtQJMzJ48gm6K4uM_vjRSEVZFWxlpt3exPnNFn8' }}
          VITE_APP_NAME: "4S Clima"
          VITE_APP_VERSION: "1.0.0"
        run: |
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=https://eaixkworazrzxcttdlpd.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaXhrd29yYXpyenhjdHRkbHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTc0MjIsImV4cCI6MjEwNjQ3MzQyMn0.cuUQGtQJMzJ48gm6K4uM_vjRSEVZFWxlpt3exPnNFn8
          VITE_APP_NAME=4S Clima
          VITE_APP_VERSION=1.0.0
          EOF
          cp .env apps/tecnico/.env
          npm run build:tecnico

      - name: Prepare Android Project
        run: |
          chmod +x apps/tecnico/android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > apps/tecnico/android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets to Android
        run: |
          mkdir -p apps/tecnico/android/app/src/main/assets/public
          cp -r apps/tecnico/dist/* apps/tecnico/android/app/src/main/assets/public/
          cp apps/tecnico/capacitor.config.json apps/tecnico/android/app/src/main/assets/capacitor.config.json
          echo "Verified bundled files in assets/public:"
          ls -la apps/tecnico/android/app/src/main/assets/public/
          test -f apps/tecnico/android/app/src/main/assets/public/index.html || { echo "ERROR: index.html missing!"; exit 1; }
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('apps/tecnico/android/app/src/main/assets/public/assets');
            const jsFile = files.find(f => f.endsWith('.js'));
            if (!jsFile) throw new Error('No JS file found in assets/public/assets');
            const content = fs.readFileSync('apps/tecnico/android/app/src/main/assets/public/assets/' + jsFile, 'utf8');
            if (!content.includes('eaixkworazrzxcttdlpd.supabase.co')) {
              throw new Error('Verification failed: Real Supabase URL not found in ' + jsFile);
            }
            if (content.includes('placeholder.supabase.co')) {
              throw new Error('Verification failed: Found placeholder.supabase.co in ' + jsFile);
            }
            console.log('SUCCESS: Verified real Supabase URL is bundled in ' + jsFile);
          "



      - name: Build APK with Gradle
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1
          EXIT_CODE=$?
          echo "=== GRADLE BUILD OUTPUT ==="
          cat gradle_build.log
          echo "### Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SNIPPET=$(grep -E "(FAILURE:|What went wrong:|Execution failed for task)" -A 10 gradle_build.log | head -n 15 | tr '\r\n' ' ')
            if [ -z "$ERR_SNIPPET" ]; then
              ERR_SNIPPET=$(tail -n 10 gradle_build.log | tr '\r\n' ' ')
            fi
            echo "::error title=Gradle Failed::$ERR_SNIPPET"
            exit $EXIT_CODE
          fi
        working-directory: apps/tecnico/android

      - name: Find and Prepare APK for Download
        run: |
          mkdir -p apk_output
          echo "Listing all generated APKs in build directory:"
          find apps/tecnico/android -name "*.apk" -type f
          APK_FILE=$(find apps/tecnico/android -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp -v "$APK_FILE" apk_output/4S-Clima-Tecnico.apk
          else
            echo "ERROR: No APK found after assembleDebug"
            exit 1
          fi
          ls -lh apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4S-Clima-Tecnico-Debug-APK
          path: apk_output/4S-Clima-Tecnico.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-apk-test
          name: "4S Clima Técnico (APK Android)"
          body: "Descarga directa de APK para celulares de técnicos de 4S Clima con rastreo GPS en segundo plano."
          files: apk_output/4S-Clima-Tecnico.apk

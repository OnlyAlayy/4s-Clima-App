name: Build Android APK (4S Clima)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-capacitor-gps

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        env:
          CI: false
        run: npm run build:tecnico

      - name: Sync Capacitor Android
        env:
          CI: false
        run: npm --workspace=@4s-clima/tecnico run cap:sync

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: apps/tecnico/android

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/tecnico/android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4S-Clima-Tecnico-Debug-APK
          path: apps/tecnico/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
